name: Docker

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: agentic-owasp:ci

jobs:
  image:
    name: Build, smoke test, and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
      - name: Smoke test
        run: |
          status=0
          docker run --rm -v "$PWD/examples:/src:ro" "$IMAGE" > scan.txt || status=$?
          cat scan.txt
          test "$status" -eq 1
          grep -q "error \[mcp-http-no-auth\]" scan.txt
      - id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}
          grype-version: v0.120.0
          severity-cutoff: high
          output-format: sarif
      - if: ${{ !cancelled() && steps.grype.outputs.sarif }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype
      - name: Build for arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
