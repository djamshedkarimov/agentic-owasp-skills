name: Action

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  findings:
    name: Fails on the vulnerable examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scan
        uses: $/
        continue-on-error: true
        with:
          path: examples
          upload-sarif: "false"
      - name: Check outcome
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          SARIF: ${{ steps.scan.outputs.sarif }}
        run: |
          test "$OUTCOME" = failure
          jq -e '[.runs[0].results[] | select(.ruleId == "mcp-http-no-auth")] | length > 0' "$SARIF"

  clean:
    name: Passes a safe server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plant a package that shadows the scanner
        run: |
          mkdir agentic_owasp
          echo 'raise SystemExit("scanned repo code was imported")' > agentic_owasp/__init__.py
      - uses: $/
        with:
          path: examples/python/safe_server.py
          fail-on: warning
          upload-sarif: "false"
