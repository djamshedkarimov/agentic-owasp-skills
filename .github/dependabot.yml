version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /examples/typescript
    # Types must match the Node major the examples run on (see ci.yml).
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      typescript-examples:
        patterns: ["*"]
