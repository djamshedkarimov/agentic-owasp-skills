name: Agentic OWASP scan
description: Scan MCP server source against the OWASP MCP Security Cheat Sheet.
author: djamshedkarimov
branding:
  icon: shield
  color: red

inputs:
  path:
    description: File or directory to scan, relative to the workspace.
    default: "."
  fail-on:
    description: Fail when a finding at or above this severity is reported (error, warning, never).
    default: error
  upload-sarif:
    description: Upload the SARIF report to GitHub code scanning (needs security-events write).
    default: "true"
  strict:
    description: Fail with exit 2 if no files were scanned or Semgrep reported errors.
    default: "true"

outputs:
  sarif:
    description: Path to the SARIF report.
    value: ${{ steps.scan.outputs.sarif }}

runs:
  using: composite
  steps:
    - id: python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"
        update-environment: false
    - name: Install scanner
      shell: bash
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
      run: |
        venv="$RUNNER_TEMP/agentic-owasp"
        "$PYTHON" -m venv "$venv"
        "$venv/bin/pip" install --quiet --require-hashes --only-binary :all: \
          -r "$GITHUB_ACTION_PATH/docker/requirements.txt" -r "$GITHUB_ACTION_PATH/docker/build-requirements.txt"
        "$venv/bin/pip" install --quiet --no-deps --no-build-isolation "$GITHUB_ACTION_PATH"
    - id: scan
      name: Scan
      shell: bash
      env:
        TARGET: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
        STRICT: ${{ inputs.strict }}
      run: |
        report_dir=$(mktemp -d "$RUNNER_TEMP/agentic-owasp-report.XXXXXX")
        sarif="$report_dir/scan.sarif"
        export PATH="$RUNNER_TEMP/agentic-owasp/bin:$PATH"
        status=0
        scan_args=()
        case "$STRICT" in
          true) scan_args+=(--strict) ;;
          false) ;;
          *) echo 'strict must be true or false' >&2; exit 2 ;;
        esac
        agentic-owasp scan "$TARGET" --format sarif --output "$sarif" --fail-on "$FAIL_ON" "${scan_args[@]}" || status=$?
        test -f "$sarif" || exit 2
        echo "sarif=$sarif" >> "$GITHUB_OUTPUT"
        echo "status=$status" >> "$GITHUB_OUTPUT"
    - name: Annotate findings
      shell: bash
      env:
        SARIF: ${{ steps.scan.outputs.sarif }}
      run: '"$RUNNER_TEMP/agentic-owasp/bin/python" -I -m agentic_owasp.annotate "$SARIF"'
    - if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
        category: agentic-owasp
    - name: Apply fail-on
      shell: bash
      env:
        STATUS: ${{ steps.scan.outputs.status }}
      run: exit "$STATUS"
