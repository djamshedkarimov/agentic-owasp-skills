name: Agentic OWASP scan
description: Scan MCP server source against the OWASP MCP Security Cheat Sheet.
author: djamshedkarimov
branding:
  icon: shield
  color: red

inputs:
  path:
    description: File or directory to scan, relative to the workspace.
    default: "."
  fail-on:
    description: Fail when a finding at or above this severity is reported (error, warning, never).
    default: error
  upload-sarif:
    description: Upload the SARIF report to GitHub code scanning (needs security-events write).
    default: "true"

outputs:
  sarif:
    description: Path to the SARIF report.
    value: ${{ steps.scan.outputs.sarif }}

runs:
  using: composite
  steps:
    - id: python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"
        update-environment: false
    - name: Install scanner
      shell: bash
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
      run: |
        venv="$RUNNER_TEMP/agentic-owasp"
        "$PYTHON" -m venv "$venv"
        "$venv/bin/pip" install --quiet --require-hashes --only-binary :all: \
          -r "$GITHUB_ACTION_PATH/docker/requirements.txt" -r "$GITHUB_ACTION_PATH/docker/build-requirements.txt"
        "$venv/bin/pip" install --quiet --no-deps --no-build-isolation "$GITHUB_ACTION_PATH"
    - id: scan
      name: Scan
      shell: bash
      env:
        TARGET: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        sarif="$RUNNER_TEMP/agentic-owasp.sarif"
        export PATH="$RUNNER_TEMP/agentic-owasp/bin:$PATH"
        status=0
        agentic-owasp scan "$TARGET" --format sarif --output "$sarif" --fail-on "$FAIL_ON" || status=$?
        test "$status" -ne 2 || exit 2
        echo "sarif=$sarif" >> "$GITHUB_OUTPUT"
        echo "status=$status" >> "$GITHUB_OUTPUT"
    - name: Annotate findings
      shell: bash
      env:
        SARIF: ${{ steps.scan.outputs.sarif }}
      run: '"$RUNNER_TEMP/agentic-owasp/bin/python" -m agentic_owasp.annotate "$SARIF"'
    - if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
        category: agentic-owasp
    - name: Apply fail-on
      shell: bash
      env:
        STATUS: ${{ steps.scan.outputs.status }}
      run: exit "$STATUS"
