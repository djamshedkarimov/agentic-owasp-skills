[project]
name = "agentic-owasp"
version = "0.1.0"
description = "OWASP-grounded security skills and source scanner for MCP servers and agentic apps"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agentic-owasp = "agentic_owasp.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_owasp"]

[tool.hatch.build.targets.wheel.hooks.custom]

[dependency-groups]
dev = [
    "mcp==2.3.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["S"]
"skills/*/rules/**" = ["S"]
"tests/**" = ["S101", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
